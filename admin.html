<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Kasir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        const firebaseConfig = {
            // Isi dengan kode Firebase Anda di sini
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.saveProduct = async () => {
            const nama = document.getElementById('nama').value;
            const harga = document.getElementById('harga').value;
            try {
                await addDoc(collection(db, "products"), { nama, harga });
                alert("Produk berhasil disimpan!");
            } catch (e) {
                alert("Gagal: " + e.message);
            }
        };
    </script>
</head>
<body class="bg-gray-100 p-5">
    <div class="max-w-md mx-auto bg-white p-6 rounded shadow">
        <h1 class="text-xl font-bold mb-4">Input Stok Barang</h1>
        <input id="nama" type="text" placeholder="Nama Produk" class="w-full border p-2 mb-2">
        <input id="harga" type="number" placeholder="Harga" class="w-full border p-2 mb-2">
        <button onclick="saveProduct()" class="w-full bg-blue-500 text-white p-2 rounded">Simpan Produk</button>
    </div>
</body>
</html>
