<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Tambah Produk</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl p-6">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">Panel Admin - Tambah Produk / Jasa</h1>
        
        <form id="productForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 font-semibold mb-2">Nama Produk / Jasa</label>
                <input type="text" id="productName" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Contoh: Servis AC 1 PK">
            </div>
            <div>
                <label class="block text-gray-700 font-semibold mb-2">Harga (Rp)</label>
                <input type="number" id="productPrice" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Contoh: 150000">
            </div>
            <div>
                <label class="block text-gray-700 font-semibold mb-2">Kategori</label>
                <select id="productCategory" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="ac">Servis AC</option>
                    <option value="kulkas">Servis Kulkas</option>
                    <option value="motor">Servis Motor</option>
                </select>
            </div>
            <div>
                <label class="block text-gray-700 font-semibold mb-2">Link Gambar / Foto</label>
                <input type="url" id="productImage" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="https://example.com/gambar.jpg">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-200">Simpan Produk</button>
        </form>
        <div id="statusMessage" class="mt-4 text-center font-semibold"></div>
    </div>

    <!-- Firebase SDK & Konfigurasi -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        // Konfigurasi Firebase milik Anda
        const firebaseConfig = {
            apiKey: "AIzaSyBe1zV3wL8mhkOq1VlOmCGUjGPZYLlObcc",
            authDomain: "my-portofolio-db-2835c.firebaseapp.com",
            projectId: "my-portofolio-db-2835c",
            storageBucket: "my-portofolio-db-2835c.firebasestorage.app",
            messagingSenderId: "420644334513",
            appId: "1:420644334513:web:4f864fdeaad3dadb5d6b90"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('productForm');
        const statusMessage = document.getElementById('statusMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            statusMessage.textContent = "Menyimpan data...";
            statusMessage.className = "mt-4 text-center font-semibold text-blue-600";

            try {
                await addDoc(collection(db, "products"), {
                    name: document.getElementById('productName').value,
                    price: Number(document.getElementById('productPrice').value),
                    category: document.getElementById('productCategory').value,
                    imageUrl: document.getElementById('productImage').value,
                    createdAt: new Date()
                });
                statusMessage.textContent = "Produk berhasil disimpan ke Database!";
                statusMessage.className = "mt-4 text-center font-semibold text-green-600";
                form.reset();
            } catch (error) {
                console.error("Error adding document: ", error);
                statusMessage.textContent = "Gagal menyimpan: " + error.message;
                statusMessage.className = "mt-4 text-center font-semibold text-red-600";
            }
        });
    </script>
</body>
</html>
